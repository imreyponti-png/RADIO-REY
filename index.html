<!DOCTYPE html>

<html lang="ro">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="RADIO REY - Music, Chat și Vibe Live"
>

<title>RADIO REY - Live</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

<!-- HEADER -->

<header>

```
<div class="live-badge">
    <span class="live-dot"></span>
    LIVE
</div>

<h1>🎧 RADIO REY</h1>

<p>Music • Chat • Vibe</p>
```

</header>

<!-- RADIO -->

<main>

```
<section class="player">

    <h2>📻 Radio Live</h2>


    <div class="now-playing">

        <div class="cover">
            🎵
        </div>


        <div class="track-info">

            <span>ACUM SE ASCULTĂ</span>

            <strong>RADIO REY</strong>

            <p>Music • Chat • Vibe</p>

        </div>

    </div>


    <!-- BUTON CĂTRE PAGINA INTERNĂ -->

    <a
        href="listen.html"
        class="radio-button"
        aria-label="Ascultă RADIO REY Live"
    >
        ▶ ASCULTĂ RADIO REY LIVE
    </a>

</section>


<!-- CHAT -->

<section class="chat">

    <h2>💬 Chat Live</h2>


    <div
        id="messages"
        aria-live="polite"
    >
        <p class="empty-message">
            Bine ai venit! Scrie primul mesaj 👋
        </p>
    </div>


    <div class="send">

        <input
            type="text"
            id="username"
            placeholder="Numele tău"
            maxlength="30"
            autocomplete="nickname"
        >


        <input
            type="text"
            id="message"
            placeholder="Scrie un mesaj..."
            maxlength="300"
            autocomplete="off"
        >


        <button
            id="sendBtn"
            type="button"
        >
            Trimite
        </button>

    </div>

</section>
```

</main>

<!-- FOOTER -->

<footer>

```
<p>
    © 2026 RADIO REY • Music • Chat • Vibe
</p>
```

</footer>

<script src="script.js"></script>

</body>

</html>
