<!DOCTYPE html>
<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>RADIO REY - Live</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- PAGINA PRINCIPALĂ -->

<main class="container">


    <!-- HEADER -->

    <header class="header">

        <div class="live-badge">
            <span class="live-dot"></span>
            LIVE
        </div>

        <h1>🎧 RADIO REY</h1>

        <p>Music • Chat • Vibe</p>

    </header>


    <!-- ZONA RADIO -->

    <section class="radio-section">

        <h2>📻 RADIO REY LIVE</h2>

        <p class="radio-text">
            Ascultă RADIO REY direct aici.
        </p>


        <!-- CHENARUL RADIOULUI -->

        <div class="radio-frame">

            <div class="radio-frame-header">

                <span class="mini-live-dot"></span>

                <span>
                    RADIO REY
                </span>

            </div>


            <!-- PLAYER OFICIAL MYRADIOSTREAM -->

            <div id="radio-player">

                <script src="//myradiostream.com/embed/Reyponti"></script>

            </div>

        </div>


        <p class="radio-status">
            🔴 LIVE • Music • Chat • Vibe
        </p>

    </section>


    <!-- CHAT -->

    <section class="chat">

        <h2>💬 Chat Live</h2>

        <p class="chat-info">
            Vorbește cu ascultătorii RADIO REY.
        </p>


        <!-- MESAJE -->

        <div
            id="messages"
            class="messages"
        >

            <div class="welcome-message">

                👋 Bine ai venit în chatul RADIO REY!

            </div>

        </div>


        <!-- FORMULAR CHAT -->

        <div class="send">

            <input
                type="text"
                id="username"
                placeholder="Numele tău"
                maxlength="30"
            >


            <div class="message-row">

                <input
                    type="text"
                    id="message"
                    placeholder="Scrie un mesaj..."
                    maxlength="300"
                >


                <button
                    id="sendBtn"
                    type="button"
                >
                    Trimite
                </button>

            </div>

        </div>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 RADIO REY
        </p>

        <span>
            Music • Chat • Vibe
        </span>

    </footer>


</main>


<script src="script.js"></script>


</body>

</html>
