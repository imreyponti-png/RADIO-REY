<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RADIO REY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <header>
        <h1>🎧 RADIO REY</h1>
        <p>Music • Chat • Vibe</p>
    </header>

    <section class="player">

        <h2>Radio Live</h2>

        <audio controls autoplay>
            <source src="http://s6.myradiostream.com:51318/" type="audio/mpeg">
            Browserul tău nu suportă playerul audio.
        </audio>

    </section>

    <section class="chat">

        <h2>💬 Chat Live</h2>

        <div id="messages"></div>

        <div class="send">

            <input
                type="text"
                id="username"
                placeholder="Numele tău">

            <input
                type="text"
                id="message"
                placeholder="Scrie un mesaj...">

            <button id="sendBtn">
                Trimite
            </button>

        </div>

    </section>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
