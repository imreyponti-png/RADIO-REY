<!DOCTYPE html>

<html lang="ro">

<head>
    <meta charset="UTF-8">

```
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>RADIO REY - Live</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<!-- HEADER -->

<header>

    <div class="live-badge">
        <span class="live-dot"></span>
        LIVE
    </div>

    <h1>🎧 RADIO REY</h1>

    <p>Music • Chat • Vibe</p>

</header>


<!-- RADIO -->

<section class="player">

    <h2>📻 Radio Live</h2>


    <div class="now-playing">

        <div class="cover">
            🎵
        </div>


        <div class="track-info">

            <span>ACUM SE ASCULTĂ</span>

            <strong>RADIO REY</strong>

            <p>Music • Chat • Vibe</p>

        </div>

    </div>


    <!-- BUTON RADIO -->

    <a
        href="http://Reyponti.on-air.fm/"
        target="_blank"
        rel="noopener noreferrer"
        class="radio-button"
    >
        ▶ ASCULTĂ RADIO REY LIVE
    </a>

</section>


<!-- CHAT -->

<section class="chat">

    <h2>💬 Chat Live</h2>


    <div id="messages"></div>


    <div class="send">

        <input
            type="text"
            id="username"
            placeholder="Numele tău"
            maxlength="30"
        >


        <input
            type="text"
            id="message"
            placeholder="Scrie un mesaj..."
            maxlength="300"
        >


        <button id="sendBtn">
            Trimite
        </button>

    </div>

</section>


<script src="script.js"></script>
```

</body>

</html>
